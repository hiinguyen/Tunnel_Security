<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Bản đồ tuyến cống</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="libs/maplibre-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b1121;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .maplibregl-popup {
            max-width: 90% !important; /* Ép popup không được to hơn 90% chiều rộng bản đồ */
        }

        /* --- DARK POPUP (Mặc định) --- */
        .maplibregl-popup-content {
            background-color: #1e293b;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 350px !important;
            width: max-content;
            max-width: 100% !important;
            max-height: 250px; /* Nếu nội dung quá dài thì không bị tràn khỏi viền dưới bản đồ */
            overflow-y: auto; /* Tự động hiện thanh cuộn dọc nếu cần */
        }

        .maplibregl-popup-close-button {
            color: #94a3b8;
            font-size: 18px;
            padding: 4px;
        }

            .maplibregl-popup-close-button:hover {
                background-color: transparent;
                color: #f1f5f9;
            }

        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: #1e293b;
        }

        .maplibregl-popup-anchor-top .maplibregl-popup-tip {
            border-bottom-color: #1e293b;
        }

        .maplibregl-popup-anchor-left .maplibregl-popup-tip {
            border-right-color: #1e293b;
        }

        .maplibregl-popup-anchor-right .maplibregl-popup-tip {
            border-left-color: #1e293b;
        }

        /* --- LIGHT POPUP --- */
        body.light-theme {
            background-color: #f8fafc;
        }

            body.light-theme .maplibregl-popup-content {
                background-color: #ffffff;
                color: #1e293b;
                border: 1px solid #e2e8f0;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            body.light-theme .maplibregl-popup-close-button {
                color: #64748b;
            }

                body.light-theme .maplibregl-popup-close-button:hover {
                    color: #0f172a;
                }

            body.light-theme .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
                border-top-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-top .maplibregl-popup-tip {
                border-bottom-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-left .maplibregl-popup-tip {
                border-right-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-right .maplibregl-popup-tip {
                border-left-color: #ffffff;
            }

        /* Hiệu ứng nháy đỏ cho sự cố */
        .incident-pulse {
            width: 50px;
            height: 50px;
            background-color: rgba(239, 68, 68, 0.3);
            border: 2px solid #EF4444;
            border-radius: 50%;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none; /* Để không che mất click vào hố ga */
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.3);
                opacity: 1;
            }

            80% {
                transform: scale(1.5);
                opacity: 0;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* 🔴 CRITICAL: Nút màu đỏ tĩnh + Sóng radar nhỏ tỏa ra từ tâm */
        .pulse-critical {
            width: 16px; /* Kích thước bằng nút hố ga bình thường */
            height: 16px;
            background-color: #EF4444;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            position: relative;
        }
            /* Vòng sóng tỏa ra ngoài */
            .pulse-critical::after {
                content: '';
                position: absolute;
                top: -12px; /* Bù trừ tọa độ để sóng nằm ngay giữa tâm nút */
                left: -12px;
                width: 36px;
                height: 36px;
                border: 2px solid #EF4444;
                border-radius: 50%;
                animation: radar-pulse 1.2s ease-out infinite;
                pointer-events: none;
            }

        /* 🟠 HIGH: Nút màu cam tự chớp nháy (không có sóng lan tỏa) */
        /* Vòng đánh dấu node đang xem chi tiết (chế độ chỉ xem trong dialog) */
        .focus-ring {
            width: 28px;
            height: 28px;
            border: 2px solid #60A5FA;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.25);
            pointer-events: none;
        }

        .blink-high {
            width: 16px;
            height: 16px;
            background-color: #F97316;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            animation: node-blinker 0.6s infinite alternate; /* Sáng lên rồi mờ đi */
        }

        /* Khung hình Animation */
        @keyframes radar-pulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }

            100% {
                transform: scale(2.0);
                opacity: 0;
            }
        }

        @keyframes node-blinker {
            0% {
                opacity: 1;
                box-shadow: 0 0 12px #F97316;
            }

            100% {
                opacity: 0.4;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="libs/maplibre-gl.js"></script>
    <script src="libs/pmtiles.js"></script>

    <script>
        let backendBaseUrl = "";
        let stationId = "";
        let mapInitialized = false;
        let currentTheme = "Dark";
        let sensorsGeoJson = null;

        // --- CẤU HÌNH CÁC TUYẾN CỐNG NỐI VỚI NHAU ---
        const routeConfigs = [
            // Tuyến Đội Cấn
            { status: 'active', nodes: ['hub-01', 'dc-01', 'dc-02', 'dc-03', 'dc-04', 'dc-05', 'dc-06', 'dc-07', 'dc-08', 'dc-09', 'dc-10'] },
            // Tuyến Kim Mã
            { status: 'warning', nodes: ['hub-01', 'km-01', 'km-02', 'km-03', 'km-04', 'km-05', 'km-06', 'km-07', 'km-08', 'km-09', 'km-10'] },
            // Tuyến Hoàng Hoa Thám
            { status: 'active', nodes: ['hub-01', 'hht-01', 'hht-02', 'hht-03', 'hht-04', 'hht-05', 'hht-06', 'hht-07', 'hht-08', 'hht-09', 'hht-10'] },
            // Tuyến Phan Đình Phùng
            { status: 'critical', nodes: ['hub-01', 'pdp-01', 'pdp-02', 'pdp-03', 'pdp-04', 'pdp-05', 'pdp-06', 'pdp-07', 'pdp-08', 'pdp-09', 'pdp-10'] }
        ];

        function sendMessage(obj) {
            try {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify(obj));
                }
            } catch (e) { console.error("sendMessage error", e); }
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                // SỬA Ở ĐÂY: Trả lại event.data gốc, bỏ JSON.parse đi
                const msg = event.data;

                if (msg.type === "init") {
                    backendBaseUrl = msg.backend;
                    stationId = msg.station;
                    window.mapReadOnly = !!msg.readonly;
                    initMap();
                }

                if (msg.type === "focus-node") {
                    window.focusTarget = { nodeId: msg.nodeId, nodeName: msg.nodeName, lineName: msg.lineName };
                    applyFocusNode(!sensorsGeoJson);
                }

                if (msg.type === "refresh-data" && mapInitialized) {
                    loadSensors();
                    loadRoutes();
                }

                // --- HIỆU ỨNG NHÁY ĐỎ BẢN ĐỒ ---
                // --- HIỆU ỨNG & ĐỔI MÀU BẢN ĐỒ THEO MỨC ĐỘ ---
                if (msg.type === "highlight-node") {
                    if (!sensorsGeoJson || !window.map) return;

                    const node = sensorsGeoJson.features.find(f => f.properties.id === msg.nodeId);
                    if (node) {
                        const coords = node.geometry.coordinates;
                        const severity = msg.severity; // Sẽ nhận: "Critical", "High", "Medium", "Low"
                        const lineName = node.properties.line; // Thuộc tuyến nào (VD: Tuyến Kim Mã)

                        // 1. ĐỔI MÀU TĨNH CHO NÚT (Cập nhật trực tiếp vào GeoJSON)
                        node.properties.status = severity;
                        window.map.getSource('sensors').setData(sensorsGeoJson);

                        // 2. LÂY NHIỄM MÀU CHO ĐƯỜNG ỐNG (Routes)
                        if (routesGeoJson) {
                            const route = routesGeoJson.features.find(f => f.properties.name === lineName);
                            if (route) {
                                // Quét xem trên tuyến này có thằng nào nặng hơn không
                                let highestSeverity = "Online";
                                const nodesOnLine = sensorsGeoJson.features.filter(f => f.properties.line === lineName);

                                if (nodesOnLine.some(n => n.properties.status === "Critical")) highestSeverity = "Critical";
                                else if (nodesOnLine.some(n => n.properties.status === "High")) highestSeverity = "High";
                                else if (nodesOnLine.some(n => n.properties.status === "Medium" || n.properties.status === "Warning")) highestSeverity = "Medium";

                                route.properties.status = highestSeverity;
                                window.map.getSource('routes').setData(routesGeoJson); // Cập nhật lại đường ống
                            }
                        }

                        // 3. XỬ LÝ HOẠT ẢNH ANIMATION (Chỉ dùng cho Critical và High)
                        if (!window.activeAlertMarkers) window.activeAlertMarkers = {};
                        if (window.activeAlertMarkers[msg.nodeId]) {
                            window.activeAlertMarkers[msg.nodeId].remove();
                        }

                        if (severity === "Critical" || severity === "High") {
                            // Focus camera bản đồ nếu là Critical
                            if (severity === "Critical") {
                                window.map.flyTo({ center: coords, zoom: 17, pitch: 45, speed: 1.2 });
                            }

                            const el = document.createElement('div');
                            el.className = severity === "Critical" ? 'pulse-critical' : 'blink-high';

                            const marker = new maplibregl.Marker({ element: el })
                                .setLngLat(coords)
                                .addTo(window.map);

                            window.activeAlertMarkers[msg.nodeId] = marker;

                            // Tự xóa lớp nháy động sau 20 giây (Màu tĩnh vẫn giữ nguyên ở bước 1)
                            setTimeout(() => marker.remove(), 20000);
                        }
                    }
                }
            });
        }

        // Zoom vào node được yêu cầu và vẽ vòng đánh dấu. Gọi lại sau mỗi lần nạp lại dữ liệu/đổi theme.
        function applyFocusNode(deferred) {
            const target = window.focusTarget;
            if (deferred || !window.map || !sensorsGeoJson || !target) return;
            const feats = sensorsGeoJson.features;
            // Khớp theo id; nếu id backend khác id bản đồ thì khớp theo tên + tuyến, rồi chỉ theo tên.
            const node = feats.find(f => f.properties.id === target.nodeId)
                || feats.find(f => f.properties.name === target.nodeName && f.properties.line === target.lineName)
                || feats.find(f => f.properties.name === target.nodeName);
            if (!node) return;
            const coords = node.geometry.coordinates;
            window.map.jumpTo({ center: coords, zoom: 16.5 });
            if (window.focusMarker) window.focusMarker.remove();
            const el = document.createElement('div');
            el.className = 'focus-ring';
            window.focusMarker = new maplibregl.Marker({ element: el }).setLngLat(coords).addTo(window.map);
        }

        function initMap() {
            if (mapInitialized) return;
            mapInitialized = true;

            let protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);

            window.map = new maplibregl.Map({
                container: 'map',
                center: [105.8346, 21.0368], // Tọa độ Trạm trung tâm ở Ba Đình
                zoom: 14,                    // Zoom out ra một chút để thấy 4 tuyến rõ hơn
                minZoom: 5,
                maxZoom: 18,
                style: 'style_dark.json'
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-left');
            map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

            map.on('load', () => {
                loadSensors();
                loadRoutes();
                sendMessage({ type: "mapready" });
            });
        }

        // --- LOAD DỮ LIỆU TỪ FILE nodes.json ---
        async function loadSensors() {
            try {
                const response = await fetch('nodes.json');
                if (!response.ok) throw new Error("Không thể tải nodes.json");

                sensorsGeoJson = await response.json();

                if (map.getSource('sensors')) {
                    map.getSource('sensors').setData(sensorsGeoJson);
                } else {
                    map.addSource('sensors', { type: 'geojson', data: sensorsGeoJson });
                    setupSensorLayers();
                    setupSensorInteractions();
                    setupDraggableLogic();
                }
                applyFocusNode(false);
            } catch (e) {
                console.error("Lỗi khi load dữ liệu cảm biến:", e);
                // Dữ liệu fallback
                sensorsGeoJson = {
                    "type": "FeatureCollection",
                    "features": [
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7940, 21.0370] }, "properties": { "id": "hub-01", "name": "Trạm Trung Tâm", "code": "HUB", "isHub": true, "status": "Online", "batteryLevel": 98, "rssi": -65, "sensorCount": 5, "line": "Trạm điều khiển chính" } },
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7965, 21.0385] }, "properties": { "id": "node-01", "name": "Hố ga dự phòng", "code": "DP-01", "isHub": false, "status": "Warning", "batteryLevel": 85, "rssi": -72, "sensorCount": 2, "cameraId": "CAM-001", "line": "Tuyến dự phòng" } }
                    ]
                };
                if (!map.getSource('sensors')) {
                    map.addSource('sensors', { type: 'geojson', data: sensorsGeoJson });
                    setupSensorLayers();
                    setupSensorInteractions();
                    setupDraggableLogic();
                } else {
                    map.getSource('sensors').setData(sensorsGeoJson);
                }
            }
        }

        function setupSensorLayers() {
            // 1. Layer vẽ các nút hố ga (Sensors)
            map.addLayer({
                id: 'sensors-circle',
                type: 'circle',
                source: 'sensors',
                filter: ['!=', ['get', 'isHub'], true],
                paint: {
                    'circle-color': [
                        'match', ['get', 'status'],
                        'Critical', '#EF4444', // Đỏ
                        'High', '#F97316',     // Cam
                        'Medium', '#EAB308',   // Vàng tĩnh
                        'Warning', '#EAB308',  // (Giữ lại dự phòng data cũ)
                        'Low', '#6B7280',      // Xám
                        'Offline', '#6B7280',  // Xám
                        '#10B981'              // Xanh lá (Mặc định - Online)
                    ],
                    'circle-radius': 8,
                    'circle-stroke-color': '#0f172a',
                    'circle-stroke-width': 2
                }
            });

            // 2. Các Layer dưới đây GIỮ NGUYÊN (Vẽ trạm trung tâm và nhãn tên)
            map.addLayer({
                id: 'station-outer-ring',
                type: 'circle',
                source: 'sensors',
                filter: ['==', ['get', 'isHub'], true],
                paint: { 'circle-color': '#3B82F6', 'circle-radius': 18, 'circle-opacity': 0.3 }
            });

            map.addLayer({
                id: 'station-circle',
                type: 'circle',
                source: 'sensors',
                filter: ['==', ['get', 'isHub'], true],
                paint: { 'circle-color': '#3B82F6', 'circle-radius': 12, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 }
            });

            map.addLayer({
                id: 'station-label',
                type: 'symbol',
                source: 'sensors',
                filter: ['==', ['get', 'isHub'], true],
                layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-variable-anchor': ['top', 'bottom', 'left', 'right'], 'text-radial-offset': 1.8 },
                paint: { 'text-color': '#ffffff', 'text-halo-color': '#0b1121', 'text-halo-width': 2 }
            });

            map.addLayer({
                id: 'relay-label',
                type: 'symbol',
                source: 'sensors',
                filter: ['!=', ['get', 'isHub'], true],
                layout: { 'text-field': ['get', 'code'], 'text-font': ['Noto Sans Semibold'], 'text-size': 11, 'text-offset': [0, 1.8], 'text-anchor': 'top' },
                paint: { 'text-color': '#cbd5e1', 'text-halo-color': '#0b1121', 'text-halo-width': 2 }
            });
        }

        // --- HÀM TỰ ĐỘNG VẼ LẠI ĐƯỜNG NỐI ---
        function updateRoutes() {
            if (!sensorsGeoJson || !map.getSource('routes')) return;

            const features = [];
            routeConfigs.forEach(route => {
                const coords = [];
                route.nodes.forEach(nodeId => {
                    const node = sensorsGeoJson.features.find(f => f.properties.id === nodeId);
                    if (node) coords.push(node.geometry.coordinates);
                });

                if (coords.length > 1) {
                    features.push({
                        "type": "Feature",
                        "geometry": { "type": "LineString", "coordinates": coords },
                        "properties": { "status": route.status } // Sửa chữ 'S' thành 's'
                    });
                }
            });

            const geojson = { "type": "FeatureCollection", "features": features };
            map.getSource('routes').setData(geojson);
        }

        // --- CẬP NHẬT LOGIC LẮNG NGHE LỆNH TỪ C# ---
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const msg = event.data;

                if (msg.type === "init") {
                    backendBaseUrl = msg.backend;
                    stationId = msg.station;
                    initMap();
                }

                if (msg.type === "refresh-data" && mapInitialized) {
                    loadSensors();
                    loadRoutes();
                }

                // 1. NHẬN LỆNH BÁO ĐỘNG (BẬT NHÁY, ĐỔI MÀU)
                if (msg.type === "highlight-node") {
                    if (!sensorsGeoJson || !window.map) return;
                    const node = sensorsGeoJson.features.find(f => f.properties.id === msg.nodeId);

                    if (node) {
                        const coords = node.geometry.coordinates;
                        const severity = msg.severity;

                        // Đổi màu tĩnh cho nút
                        node.properties.status = severity;
                        window.map.getSource('sensors').setData(sensorsGeoJson);

                        // Lây nhiễm màu cho tuyến cống
                        const route = routeConfigs.find(r => r.nodes.includes(msg.nodeId));
                        if (route) {
                            let highest = "Online";
                            const nodesOnLine = sensorsGeoJson.features.filter(f => route.nodes.includes(f.properties.id));
                            if (nodesOnLine.some(n => n.properties.status === "Critical")) highest = "Critical";
                            else if (nodesOnLine.some(n => n.properties.status === "High")) highest = "High";
                            else if (nodesOnLine.some(n => n.properties.status === "Medium" || n.properties.status === "Warning")) highest = "Medium";

                            route.status = highest;
                            updateRoutes(); // Vẽ lại tuyến với màu mới
                        }

                        // Xử lý hiệu ứng nháy/sóng radar
                        if (!window.activeAlertMarkers) window.activeAlertMarkers = {};
                        if (window.activeAlertMarkers[msg.nodeId]) {
                            window.activeAlertMarkers[msg.nodeId].remove();
                        }

                        if (severity === "Critical" || severity === "High") {
                            if (severity === "Critical") {
                                window.map.flyTo({ center: coords, zoom: 17, pitch: 45, speed: 1.2 });
                            }

                            const el = document.createElement('div');
                            el.className = severity === "Critical" ? 'pulse-critical' : 'blink-high';

                            const marker = new maplibregl.Marker({ element: el })
                                .setLngLat(coords)
                                .addTo(window.map);

                            window.activeAlertMarkers[msg.nodeId] = marker;
                        }
                    }
                }

                // 2. NHẬN LỆNH ĐÃ XỬ LÝ (TẮT NHÁY, VỀ XANH)
                else if (msg.type === "restore-node") {
                    if (!sensorsGeoJson || !window.map) return;
                    const node = sensorsGeoJson.features.find(f => f.properties.id === msg.nodeId);

                    if (node) {
                        // Tắt hiệu ứng nháy
                        if (window.activeAlertMarkers && window.activeAlertMarkers[msg.nodeId]) {
                            window.activeAlertMarkers[msg.nodeId].remove();
                            delete window.activeAlertMarkers[msg.nodeId];
                        }

                        // Trả nút về màu xanh (Online)
                        node.properties.status = "Online";
                        window.map.getSource('sensors').setData(sensorsGeoJson);

                        // Trả đường ống về theo trạng thái các nút còn lại
                        const route = routeConfigs.find(r => r.nodes.includes(msg.nodeId));
                        if (route) {
                            let highest = "Online";
                            const nodesOnLine = sensorsGeoJson.features.filter(f => route.nodes.includes(f.properties.id));
                            if (nodesOnLine.some(n => n.properties.status === "Critical")) highest = "Critical";
                            else if (nodesOnLine.some(n => n.properties.status === "High")) highest = "High";
                            else if (nodesOnLine.some(n => n.properties.status === "Medium" || n.properties.status === "Warning")) highest = "Medium";

                            route.status = highest;
                            updateRoutes();
                        }
                    }
                }
            });
        }
        async function loadRoutes() {
            try {
                const emptyGeojson = { "type": "FeatureCollection", "features": [] };

                if (!map.getSource('routes')) {
                    map.addSource('routes', { type: 'geojson', data: emptyGeojson });
                    // Thêm Layer vẽ đường nối các nút
                    map.addLayer({
                        'id': 'routes-layer',
                        'type': 'line',
                        'source': 'routes',
                        'paint': {
                            'line-color': [
                                'match', ['get', 'status'],
                                'Critical', '#EF4444', // Đỏ
                                'High', '#F97316',     // Cam
                                'Medium', '#EAB308',   // Vàng
                                'Warning', '#EAB308',
                                'Low', '#6B7280',      // Xám
                                '#10B981'              // Xanh lá (Mặc định Online)
                            ],
                            'line-width': 4
                        }
                    });
                }

                updateRoutes();
            } catch (e) { console.error("Error routes:", e); }
        }

        // --- HÀM TẠO HỘP THOẠI XÁC NHẬN TÙY CHỈNH (CUSTOM CONFIRM DIALOG) ---
        function showCustomConfirm(message) {
            return new Promise((resolve) => {
                // Tạo lớp phủ nền tối (Overlay)
                const overlay = document.createElement('div');
                overlay.style.position = 'fixed';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.backgroundColor = 'rgba(11, 17, 33, 0.7)'; // Màu nền mờ
                overlay.style.display = 'flex';
                overlay.style.justifyContent = 'center';
                overlay.style.alignItems = 'center';
                overlay.style.zIndex = '9999';

                // Tạo khung hộp thoại (Dialog Box)
                const dialog = document.createElement('div');
                dialog.style.backgroundColor = '#1e293b'; // Màu nền hộp thoại
                dialog.style.border = '1px solid #334155';
                dialog.style.borderRadius = '8px';
                dialog.style.padding = '24px';
                dialog.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
                dialog.style.color = '#f1f5f9';
                dialog.style.fontFamily = 'system-ui, sans-serif';
                dialog.style.minWidth = '320px';
                dialog.style.textAlign = 'center';

                // Thêm icon và nội dung
                const msgEl = document.createElement('div');
                msgEl.innerHTML = message;
                msgEl.style.marginBottom = '20px';
                msgEl.style.fontSize = '14px';

                // Khung chứa nút bấm
                const btnContainer = document.createElement('div');
                btnContainer.style.display = 'flex';
                btnContainer.style.justifyContent = 'center';
                btnContainer.style.gap = '12px';

                // Nút Xác nhận
                const btnOk = document.createElement('button');
                btnOk.innerText = 'Lưu vị trí';
                btnOk.style.padding = '8px 20px';
                btnOk.style.backgroundColor = '#3B82F6';
                btnOk.style.color = 'white';
                btnOk.style.border = 'none';
                btnOk.style.borderRadius = '4px';
                btnOk.style.cursor = 'pointer';
                btnOk.style.fontWeight = 'bold';

                // Nút Hủy
                const btnCancel = document.createElement('button');
                btnCancel.innerText = 'Hủy bỏ';
                btnCancel.style.padding = '8px 20px';
                btnCancel.style.backgroundColor = '#475569';
                btnCancel.style.color = 'white';
                btnCancel.style.border = 'none';
                btnCancel.style.borderRadius = '4px';
                btnCancel.style.cursor = 'pointer';

                // Hiệu ứng hover cho nút
                btnOk.onmouseover = () => btnOk.style.backgroundColor = '#2563EB';
                btnOk.onmouseout = () => btnOk.style.backgroundColor = '#3B82F6';
                btnCancel.onmouseover = () => btnCancel.style.backgroundColor = '#334155';
                btnCancel.onmouseout = () => btnCancel.style.backgroundColor = '#475569';

                // Bắt sự kiện click
                btnOk.onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(true); // Trả về true khi đồng ý
                };

                btnCancel.onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(false); // Trả về false khi hủy
                };

                // Lắp ráp các thành phần lại
                btnContainer.appendChild(btnCancel);
                btnContainer.appendChild(btnOk);
                dialog.appendChild(msgEl);
                dialog.appendChild(btnContainer);
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);
            });
        }

        // --- LOGIC KÉO THẢ (DRAG & DROP) ---
        function setupDraggableLogic() {
            let isDragging = false;
            let hasMoved = false; // Cờ đánh dấu có thực sự di chuyển chuột không
            let draggedFeatureId = null;
            let originalCoords = null;
            const canvas = map.getCanvas();

            map.on('mousedown', 'sensors-circle', (e) => {
                if (window.mapReadOnly) return;
                const features = map.queryRenderedFeatures(e.point, { layers: ['sensors-circle'] });
                if (features.length > 0) {
                    e.preventDefault();
                    isDragging = true;
                    hasMoved = false; // RESET: Bắt đầu nhấn chuột chưa tính là di chuyển
                    draggedFeatureId = features[0].properties.id;

                    const feature = sensorsGeoJson.features.find(f => f.properties.id === draggedFeatureId);
                    if (feature) {
                        originalCoords = [...feature.geometry.coordinates];
                    }

                    canvas.style.cursor = 'grabbing';

                    const popups = document.getElementsByClassName('maplibregl-popup');
                    if (popups.length > 0) popups[0].remove();
                }
            });

            map.on('mousemove', (e) => {
                if (isDragging) {
                    hasMoved = true; // Chuột nhích đi mới được tính là kéo thả
                    canvas.style.cursor = 'grabbing';

                    const coords = e.lngLat;
                    const feature = sensorsGeoJson.features.find(f => f.properties.id === draggedFeatureId);

                    if (feature) {
                        feature.geometry.coordinates = [coords.lng, coords.lat];
                        map.getSource('sensors').setData(sensorsGeoJson);
                        updateRoutes();
                    }
                }
            });

            map.on('mouseup', async (e) => {
                if (isDragging) {
                    isDragging = false;
                    canvas.style.cursor = '';

                    const feature = sensorsGeoJson.features.find(f => f.properties.id === draggedFeatureId);

                    // Chỉ hiện hộp thoại nếu thực sự có di chuyển (hasMoved = true)
                    if (feature && hasMoved) {
                        const coords = e.lngLat;

                        const isConfirmed = await showCustomConfirm(`Bạn có muốn thay đổi vị trí của<br><b style="color:#60a5fa; font-size:16px;">${feature.properties.name}</b> ?`);

                        if (isConfirmed) {
                            sendMessage({
                                type: "node-moved",
                                nodeId: draggedFeatureId,
                                lng: coords.lng,
                                lat: coords.lat
                            });
                        } else {
                            feature.geometry.coordinates = originalCoords;
                            map.getSource('sensors').setData(sensorsGeoJson);
                            updateRoutes();
                        }
                    }

                    draggedFeatureId = null;
                    originalCoords = null;
                }
            });
        }
        function setupSensorInteractions() {
            const popupLayers = ['sensors-circle', 'station-circle'];
            map.on('click', popupLayers, async (e) => {
                if (window.mapReadOnly) return;
                const p = e.features[0].properties;

                // Lấy tọa độ thực tế từ RAM (bộ nhớ) để tránh bị cache đồ họa
                const memNode = sensorsGeoJson.features.find(f => f.properties.id === p.id);
                const coords = memNode ? memNode.geometry.coordinates.slice() : e.features[0].geometry.coordinates.slice();

                while (Math.abs(e.lngLat.lng - coords[0]) > 180) { coords[0] += e.lngLat.lng > coords[0] ? 360 : -360; }

                const popupContent = document.createElement('div');
                buildPopupHTML(popupContent, p, coords);

                map.flyTo({
                    center: coords,
                    offset: [0, -100],
                    speed: 1.5,
                    essential: true
                });

                new maplibregl.Popup({
                    closeOnClick: true,
                    maxWidth: 'none',
                    offset: 15                  })
                    .setLngLat(coords)
                    .setDOMContent(popupContent)
                    .addTo(map);

                loadSensorDetailsForPopup(p.id, p.isHub);
            });

            map.on('mouseenter', popupLayers, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', popupLayers, () => { map.getCanvas().style.cursor = ''; });
        }

        function buildPopupHTML(container, p, coords) {
            // Severity palette from DESIGN.md. Each status also gets a geometric marker so it
            // never relies on color alone: circle = online, triangle = warning/critical, ring = offline.
            const statusColors = { 'Online': '#3FCF8E', 'Warning': '#FFD166', 'Critical': '#FF5252', 'Offline': '#7B7E85' };
            const statusMarkers = { 'Online': '●', 'Warning': '▲', 'Critical': '▲', 'Offline': '○' };
            const statusColor = statusColors[p.status] || '#94A3B8';
            const statusMarker = statusMarkers[p.status] || '○';
            const hubTag = p.isHub
                ? ' <span style="display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 6px; border: 1px solid #1D4ED8; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #60A5FA;">HUB</span>'
                : '';
            const hubStyle = p.isHub ? 'color: #60a5fa; font-weight: 600;' : 'color: #94a3b8;';

            let html = `
                    <div style="border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 8px;">
                        <div style="font-size: 15px; font-weight: 600; color: #f1f5f9;">${p.name}${hubTag}</div>
                        <div style="font-size: 12px; ${hubStyle}">${p.code} • ${p.line || 'N/A'}</div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; margin-bottom: 10px;">
                        <div><span style="color: #94a3b8;">Trạng thái:</span> <strong style="color: ${statusColor};"><span style="font-size: 9px; margin-right: 4px;">${statusMarker}</span>${p.status}</strong></div>
                        <div><span style="color: #94a3b8;">Pin:</span> <strong style="color: #f1f5f9;">${p.batteryLevel}%</strong></div>
                        <div><span style="color: #94a3b8;">RSSI:</span> <strong style="color: #f1f5f9;">${p.rssi} dBm</strong></div>
                        <div><span style="color: #94a3b8;">Sensors:</span> <strong style="color: #f1f5f9;">${p.sensorCount}</strong></div>
                    </div>
                    <div id="sensors-section-${p.id}" style="border-top: 1px solid #334155; padding-top: 8px; margin-top: 8px;">
                        <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b; margin-bottom: 6px;">
                            Cảm biến <span id="sensors-loading-${p.id}" style="font-weight: normal; letter-spacing: 0; text-transform: none;">(đang tải...)</span>
                        </div>
                        <div id="sensors-list-${p.id}" style="max-height: 180px; overflow-y: auto;"></div>
                    </div>
                    <div style="margin-top: 12px; display: flex; gap: 8px;">
                        ${p.cameraId ? `<button onclick="window.onViewCamera('${p.cameraId}','${p.id}')" style="flex: 1; padding: 7px 10px; background-color: #111621; color: #E6EEF3; border: 1px solid #2D3545; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Xem camera</button>` : ''}
                        <button onclick="window.onManageDevice('${p.id}')" style="flex: 1; padding: 7px 10px; background-color: #144BB8; color: #fff; border: 1px solid #144BB8; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Quản lý</button>
                    </div>

                    <div style="margin-top: 12px; padding-top: 8px; border-top: 1px dashed #334155;">
                        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Sửa tọa độ (Lng, Lat):</div>
                        <div style="display: flex; gap: 4px;">
                            <input type="number" step="0.00001" id="lng-${p.id}" value="${coords[0].toFixed(5)}" style="width: 40%; font-size: 11px; background: transparent; color: inherit; border: 1px solid #64748b; border-radius: 3px; padding: 2px 4px;">
                            <input type="number" step="0.00001" id="lat-${p.id}" value="${coords[1].toFixed(5)}" style="width: 40%; font-size: 11px; background: transparent; color: inherit; border: 1px solid #64748b; border-radius: 3px; padding: 2px 4px;">
                            <button onclick="window.moveNodeToCoords('${p.id}', document.getElementById('lng-${p.id}').value, document.getElementById('lat-${p.id}').value)"
                                    style="background: #6366f1; color: white; border: none; border-radius: 3px; cursor: pointer; flex: 1; font-size: 11px;">
                                Cập nhật
                            </button>
                        </div>
                    </div>
                `;
            container.innerHTML = html;
        }

        async function loadSensorDetailsForPopup(nodeId, isHub) {
            try {
                const loadingEl = document.getElementById(`sensors-loading-${nodeId}`);
                const listEl = document.getElementById(`sensors-list-${nodeId}`);
                if (loadingEl) loadingEl.style.display = 'none';
                if (listEl) {
                    const sensors = [
                        { name: 'Nhiệt độ', type: 'Temperature', currentValue: 28.5, unit: '°C', warningThreshold: 40, criticalThreshold: 50 },
                        { name: 'Độ ẩm', type: 'Humidity', currentValue: 75, unit: '%', warningThreshold: 85, criticalThreshold: 95 },
                        { name: 'Khí độc H2S', type: 'Gas', currentValue: 12, unit: 'ppm', warningThreshold: 10, criticalThreshold: 20 }
                    ];
                    listEl.innerHTML = sensors.map(s => renderSensorItem(s)).join('');
                }
            } catch (err) { console.error('Failed details:', err); }
        }

        function renderSensorItem(s) {
            const isWarning = s.currentValue >= s.warningThreshold;
            const isCritical = s.currentValue >= s.criticalThreshold;
            const sensorColor = isCritical ? '#FF5252' : (isWarning ? '#FFD166' : '#3FCF8E');
            const tag = getSensorTag(s.type);
            // Instrument tag (text) instead of a pictogram; tint encodes sensor identity, not severity.
            const tagHtml = `<span style="display: inline-block; min-width: 34px; text-align: center; padding: 1px 5px; border: 1px solid #2D3545; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: ${tag.color};">${tag.code}</span>`;
            return `<div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; margin-bottom: 4px; background-color: #111621; border: 1px solid #1F2937; border-radius: 6px; font-size: 12px;"><div style="display: flex; align-items: center; gap: 8px;">${tagHtml}<span style="color: inherit;">${s.name}</span></div><div style="display: flex; align-items: center; gap: 4px;"><span style="font-weight: 600; font-variant-numeric: tabular-nums; color: ${sensorColor};">${s.currentValue?.toFixed(1) || 'N/A'}</span><span style="color: #94a3b8;">${s.unit}</span></div></div>`;
        }

        // Sensor identity colors match MonitoringSensor*Brush in Station/Styles/Colors.xaml.
        function getSensorTag(type) {
            const tags = {
                'Temperature': { code: 'TEMP', color: '#FFB347' },
                'Humidity':    { code: 'HUM',  color: '#22D3EE' },
                'Vibration':   { code: 'VIB',  color: '#84CC16' },
                'Pressure':    { code: 'PRES', color: '#818CF8' },
                'Gas':         { code: 'GAS',  color: '#2DD4BF' },
                'Radar':       { code: 'RAD',  color: '#94A3B8' },
                'SmokeFire':   { code: 'FIRE', color: '#94A3B8' },
                'WaterLevel':  { code: 'LVL',  color: '#94A3B8' },
                'Motion':      { code: 'MOT',  color: '#94A3B8' }
            };
            return tags[type] || { code: 'SEN', color: '#94A3B8' };
        }

        window.onViewCamera = function (cameraId, nodeId) { sendMessage({ type: "viewcamera", cameraId: cameraId, nodeId: nodeId }); };
        window.onManageDevice = function (nodeId) { sendMessage({ type: "managedevice", nodeId: nodeId }); };

        // --- CẬP NHẬT TỌA ĐỘ BẰNG TAY TỪ POPUP ---
        window.moveNodeToCoords = function (nodeId, newLng, newLat) {
            if (!sensorsGeoJson) return;

            const lng = parseFloat(newLng);
            const lat = parseFloat(newLat);

            if (isNaN(lng) || isNaN(lat)) {
                alert("Vui lòng nhập tọa độ hợp lệ!");
                return;
            }

            const feature = sensorsGeoJson.features.find(f => f.properties.id === nodeId);
            if (feature) {
                feature.geometry.coordinates = [lng, lat];
                map.getSource('sensors').setData(sensorsGeoJson);

                // Cập nhật đường nối
                updateRoutes();

                sendMessage({
                    type: "node-moved",
                    nodeId: nodeId,
                    lng: lng,
                    lat: lat
                });

                const popups = document.getElementsByClassName('maplibregl-popup');
                if (popups.length > 0) popups[0].remove();

                map.flyTo({ center: [lng, lat], zoom: 16 });
                console.log(`Đã cập nhật tọa độ nút ${nodeId} thành: ${lng}, ${lat}`);
            }
        };

        window.updateNode = function (node) {
            try {
                if (!sensorsGeoJson || !node || !node.id) return;

                const features = sensorsGeoJson.features || [];
                const idx = features.findIndex(f => f.properties && f.properties.id === node.id);

                if (idx >= 0) {
                    Object.assign(features[idx].properties, node);
                } else {
                    return;
                }

                if (map && map.getSource('sensors')) {
                    map.getSource('sensors').setData(sensorsGeoJson);
                }
            } catch (e) {
                console.error("updateNode error", e);
            }
        };

        window.updateNodes = function (nodes) {
            try {
                if (!Array.isArray(nodes)) return;

                let isUpdated = false;
                nodes.forEach(node => {
                    if (!sensorsGeoJson || !node || !node.id) return;
                    const features = sensorsGeoJson.features || [];
                    const idx = features.findIndex(f => f.properties && f.properties.id === node.id);

                    if (idx >= 0) {
                        Object.assign(features[idx].properties, node);
                        isUpdated = true;
                    }
                });

                if (isUpdated && map && map.getSource('sensors')) {
                    map.getSource('sensors').setData(sensorsGeoJson);
                }
            } catch (e) {
                console.error("updateNodes error", e);
            }
        };

        function setTheme(theme) {
            currentTheme = theme || "Dark";

            if (currentTheme === "Light") {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }

            if (window.map) {
                const styleFile = currentTheme === "Light" ? 'style_light.json' : 'style_dark.json';
                window.map.setStyle(styleFile);

                window.map.once('style.load', () => {
                    loadSensors();
                    loadRoutes();
                });
            }
            console.log("Theme changed to:", currentTheme);
        }

        window.setTheme = setTheme;
    </script>
