# Broker trên PC trạm (docs/lan-architecture-protocol.md mục 3, 4.9).
# Mọi client phải đăng nhập; tài khoản và ACL do plugin Dynamic Security quản lý,
# BackendV2 tự tạo tài khoản cho từng tuyến khi duyệt NM mới.
listener 1883
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

# Lần chạy đầu, plugin tự tạo file cấu hình với tài khoản "admin" lấy mật khẩu từ biến
# MOSQUITTO_DYNSEC_PASSWORD (tối thiểu 12 ký tự). BackendV2 đăng nhập bằng tài khoản này.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Môi trường thật: bật TLS (cổng 8883) và tắt listener 1883.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

# Bridge 3 loại bản tin uplink lên Center (docs mục 6). QoS 1 + cleansession false để broker
# tự đệm khi đường lên Center gián đoạn.
# connection center
# address center.example.local:8883
# bridge_cafile /mosquitto/certs/center-ca.crt
# remote_username station-st01
# remote_password change-me
# cleansession false
# topic center/# out 1
