services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: tunnel_timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./docker/timescaledb-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tunnel_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      # Chỉ dùng ở lần chạy đầu để tạo tài khoản admin; phải khớp Mqtt:Password của BackendV2.
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_ADMIN_PASSWORD:-dev-admin-password}
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  # SQL Server cho máy Linux/macOS (trên Windows dùng SQL Express sẵn có).
  # Bật bằng: docker compose --profile sqlserver up -d
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tunnel_sqlserver
    restart: unless-stopped
    profiles: ["sqlserver"]
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev-Passw0rd!}
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  timescale_data:
  mosquitto_data:
  sqlserver_data:
